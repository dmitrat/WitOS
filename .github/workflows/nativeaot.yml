name: NativeAOT M3 reference and guest acceptance

on:
  push:
    branches: [main]
    paths:
      - 'experiments/NativeAotProbe/**'
      - 'experiments/NativeAotTarget/**'
      - 'experiments/NativeAotBoot/**'
      - 'tools/WitOS.Dev/**'
      - 'src/Runtime.NativeAot/**'
      - 'src/Runtime.CoreClr/**'
      - 'src/Boot.Uefi/**'
      - 'src/Kernel.Arch.X64/**'
      - 'src/Kernel/**'
      - 'tests/User.X64/**'
      - 'tests/Runtime.NativeAot/**'
      - 'tests/WitOS.Dev.Tests/**'
      - 'tests/WitOS.Dev.Tests.Child/**'
      - 'WitOS.slnx'
      - 'src/System.Native/**'
      - 'src/Kernel/include/witos/**'
      - '.gitattributes'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/nativeaot.yml'
  pull_request:
    paths:
      - 'experiments/NativeAotProbe/**'
      - 'experiments/NativeAotTarget/**'
      - 'experiments/NativeAotBoot/**'
      - 'tools/WitOS.Dev/**'
      - 'src/Runtime.NativeAot/**'
      - 'src/Runtime.CoreClr/**'
      - 'src/Boot.Uefi/**'
      - 'src/Kernel.Arch.X64/**'
      - 'src/Kernel/**'
      - 'tests/User.X64/**'
      - 'tests/Runtime.NativeAot/**'
      - 'tests/WitOS.Dev.Tests/**'
      - 'tests/WitOS.Dev.Tests.Child/**'
      - 'WitOS.slnx'
      - 'src/System.Native/**'
      - 'src/Kernel/include/witos/**'
      - '.gitattributes'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/nativeaot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-nativeaot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-probe:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache pinned compiler packages and source files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/nuget
            .tools/runtime-audit
          key: nativeaot-win-x64-${{ hashFiles('experiments/NativeAotProbe/packages.lock.json', 'experiments/NativeAotTarget/packages.lock.json', 'experiments/NativeAotProbe/upstream.lock.json') }}

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Host tooling regressions
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build

      - name: Verify pinned upstream sources and package provenance
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- runtime-audit

      - name: Publish and run HOSTED NativeAOT reference
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- runtime-probe

      - name: Inspect target objects and native bootstrap (HOSTED)
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- runtime-target

      - name: Build upstream native sources and verify WitOS overlay
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- runtime-source

      - name: Hosted PE parser corpus
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build --filter TestCategory=Pe

      - name: Cache pinned LLVM coverage toolchain download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads/LLVM-20.1.8-win64.exe
          key: llvm-20.1.8-win64-3197846a2b190636

      - name: Native parser branch coverage and AddressSanitizer
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build --filter TestCategory=PeCoverage

      - name: Bounded native parser fuzz smoke
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build --filter TestCategory=PeFuzz

      - name: Cache pinned QEMU download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads/qemu-w64-setup-20260811.exe
          key: qemu-windows-x64-20260811-5bcf9eed634e8575

      - name: Extract verified QEMU
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: QEMU timeout native-completion stress
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build --filter TestCategory=QemuCleanup

      - name: Kernel regression matrix
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test

      - name: CoreCLR function-table and target-unwind Windows reference
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- coreclr-functions

      - name: CoreCLR executable-memory and dynamic-unwind guest capabilities
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- coreclr-memory

      - name: CoreCLR assembly delivery and readonly storage guest capabilities
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- coreclr-storage

      - name: Execute upstream configuration inside WitOS
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- runtime-config

      - name: Execute repeated managed GC/EH/finalization/thread acceptance
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- runtime-boot-run

      - name: Upload hosted reference and guest execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-nativeaot-10.0.8-win-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/q0-tests/
            artifacts/runtime-probe/
            artifacts/runtime-target/
            artifacts/runtime-source/
            artifacts/runtime-readiness/
            artifacts/runtime-unwind/
            artifacts/coreclr-function-tables/
            artifacts/logs/coreclr-memory*
            artifacts/logs/coreclr-storage*
            artifacts/x64/coreclr-storage/boot-package.json
            artifacts/x64/coreclr-storage/CoreClrStorageFixture.pe
            artifacts/x64/coreclr-memory/coreclr-mapper-image.json
            artifacts/x64/coreclr-memory/CoreClrMapperFixture.pe
            artifacts/runtime-config/
            artifacts/logs/runtime-config*
            artifacts/logs/runtime-boot*
            artifacts/runtime-gc-layout-reference/
            artifacts/runtime-gp-reference/
            artifacts/runtime-seh-reference/
            artifacts/x64/runtime-boot/runtime-input.json
            artifacts/x64/runtime-boot/acceptance.json
            artifacts/x64/runtime-boot/current-run.json
            artifacts/x64/runtime-boot/last-success.json
            artifacts/x64/runtime-boot/runs/
            artifacts/x64/runtime-boot/WitOS-x64.img
            artifacts/x64/runtime-config/RuntimeConfigFixture.pe
            artifacts/x64/runtime-config/RuntimeConfigRawFixture.pe
            artifacts/x64/runtime-config/RuntimeCpuFixture.pe
            artifacts/x64/runtime-config/RuntimeCpuRawFixture.pe
            artifacts/x64/runtime-config/WitOS-x64.img
