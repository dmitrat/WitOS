name: Kernel boot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: windows-2025
    # Guest boots run in virtual time (T1); a slow runner needs more than 20 minutes for every scenario.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache pinned QEMU download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads
          key: qemu-windows-x64-20260811-5bcf9eed634e8575

      - name: Cache pinned microsoft/STL sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/stl
          key: stl-${{ hashFiles('src/Runtime.Cxx/stl.lock.json') }}

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Host tooling regressions
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build

      - name: Cache pinned LLVM installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads/LLVM-20.1.8-win64.exe
          key: llvm-20.1.8-win64-3197846a2b190636

      - name: Cache pinned musl tarball, compiler-rt builtins and the LLVM C++ runtime sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/musl-1.2.5.tar.gz
            .tools/downloads/libunwind-20.1.8.src.tar.xz
            .tools/downloads/libcxxabi-20.1.8.src.tar.xz
            .tools/downloads/libcxx-20.1.8.src.tar.xz
            .tools/downloads/linux-headers-4.19.88-2.tar.xz
            .tools/llvm-runtimes-20.1.8/llvm-project
            .tools/compiler-rt
            .tools/libc-test
          key: substrate-pins-${{ hashFiles('src/Substrate/compiler-rt.lock.json', 'src/Substrate/libc-test.lock.json', 'src/Substrate/llvm-runtimes.lock.json', 'src/Substrate/linux-headers.lock.json') }}-musl-1.2.5

      - name: Check source formatting
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- format-check

      - name: Extract verified QEMU, clang, musl, libc-test and the LLVM C++ runtimes
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: Check environment
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- doctor

      - name: Run real VM integration scenarios
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test

      - name: Release kernel without self-tests
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release

      - name: Upload boot image and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-kernel-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/x64/boot/BOOTX64.EFI
            artifacts/x64/boot/UserFixture.pe
            artifacts/x64/boot/ThreadFixture.pe
            artifacts/x64/boot/WaitFixture.pe
            artifacts/x64/boot/PeFixture.pe
            artifacts/x64/boot/PeFixedFixture.pe
            artifacts/x64/boot/PeFixture.map
            artifacts/x64/boot/PeFixedFixture.map
            artifacts/x64/boot/BootstrapFixture.pe
            artifacts/x64/boot/GcMemoryFixture.pe
            artifacts/x64/boot/GcMemoryFixture.map
            artifacts/x64/boot/gc-memory-build.json
            artifacts/x64/boot/gc-missing-link.log
            artifacts/x64/boot/TlsFixture.pe
            artifacts/x64/boot/compiler-tls-build.json
            artifacts/x64/boot/compiler-tls-disassembly.log
            artifacts/x64/boot/DynamicTlsFixture.pe
            artifacts/x64/boot/DynamicTlsFixture.map
            artifacts/x64/boot/dynamic-tls-build.json
            artifacts/x64/boot/dynamic-tls-symbols.log
            artifacts/x64/boot/PalPlainFixture.pe
            artifacts/x64/boot/PalThreadFixture.pe
            artifacts/x64/boot/pal-build.json
            artifacts/x64/boot/PalModuleFixture.pe
            artifacts/x64/boot/pal-module-build.json
            artifacts/x64/boot/PalBackgroundFixture.pe
            artifacts/x64/boot/pal-background-build.json
            artifacts/x64/boot/WitOS-x64.img
            artifacts/x64/boot/WitOS.pdb
            artifacts/x64/boot/WitOS.map
            artifacts/x64/boot/build.txt
            artifacts/logs/

  itanium-reference:
    # The oracle of the cxx scenario (S4): tests/User/cxx_main.cpp built natively on Linux with the host's clang and C++
    # library must print the Itanium trace that tests/User/cxx_itanium_trace.h records and that the guest must match.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the C++ scenarios natively
        run: clang++ --version && clang++ -std=c++20 -O2 -fdeclspec -w -pthread tests/User.X64/cxx_exceptions.cpp tests/User/cxx_main.cpp -o cxx_main

      - name: Run them against the recorded Itanium trace
        run: ./cxx_main

  linux-host:
    # The Linux development host (plan step T2.1a): the tool, its process runner and host tests, the pinned LLVM and
    # QEMU (built from its source release), layer 2's toolchain and the release kernels of both ISAs. The frozen line's
    # MSVC fixtures, and with them the self-test scenarios, stay on the Windows jobs until K8 (T2.2).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install what building QEMU and running LLVM need
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          bison bzip2 flex g++ gcc libglib2.0-dev libpixman-1-dev libxml2 make ninja-build pkg-config python3
          python3-venv xz-utils

      - name: Cache the pinned LLVM and QEMU releases and the built QEMU
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/LLVM-20.1.8-Linux-X64.tar.xz
            .tools/downloads/qemu-11.1.0.tar.xz
            .tools/qemu-11.1.0
          key: linux-ubuntu-24.04-llvm-20.1.8-1ead36b3dfcb774b-qemu-11.1.0-6ee1d1a61f682124

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Host tests that need no Windows host
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build

      - name: Extract verified LLVM, build QEMU, fetch musl, compiler-rt, the LLVM runtimes and libc-test
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: Check environment
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- doctor

      - name: QEMU timeout cleanup through QMP
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build --filter TestCategory=QemuCleanup

      - name: x64 release kernel without self-tests
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release

      - name: ARM64 release kernel without self-tests
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release --arch arm64

      - name: Source style
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- format-check

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-linux-host
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/logs
            artifacts/x64/release/build.txt
            artifacts/arm64/release/build.txt

  boot-arm64:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache pinned QEMU download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads
          key: qemu-windows-x64-20260811-5bcf9eed634e8575

      - name: Cache pinned LLVM installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads/LLVM-20.1.8-win64.exe
          key: llvm-20.1.8-win64-3197846a2b190636

      - name: Cache pinned musl tarball, compiler-rt builtins and the LLVM C++ runtime sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/musl-1.2.5.tar.gz
            .tools/downloads/libunwind-20.1.8.src.tar.xz
            .tools/downloads/libcxxabi-20.1.8.src.tar.xz
            .tools/downloads/libcxx-20.1.8.src.tar.xz
            .tools/downloads/linux-headers-4.19.88-2.tar.xz
            .tools/llvm-runtimes-20.1.8/llvm-project
            .tools/compiler-rt
            .tools/libc-test
          key: substrate-pins-${{ hashFiles('src/Substrate/compiler-rt.lock.json', 'src/Substrate/libc-test.lock.json', 'src/Substrate/llvm-runtimes.lock.json', 'src/Substrate/linux-headers.lock.json') }}-musl-1.2.5

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Extract verified QEMU, clang, musl, libc-test and the LLVM C++ runtimes
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: ARM64 boot-only scenarios on QEMU virt
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test --arch arm64

      - name: ARM64 release kernel without self-tests
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release --arch arm64

      - name: Upload ARM64 boot image and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-kernel-arm64
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/arm64/boot/BOOTAA64.EFI
            artifacts/arm64/boot/WitOS-arm64.img
            artifacts/arm64/boot/WitOS.pdb
            artifacts/arm64/boot/WitOS.map
            artifacts/arm64/boot/build.txt
            artifacts/logs/arm64-*
