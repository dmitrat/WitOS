name: Kernel boot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: windows-2025
    # Guest boots run in virtual time (T1); a slow runner needs more than 20 minutes for every scenario.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache pinned QEMU download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads
          key: qemu-windows-x64-20260811-5bcf9eed634e8575

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Host tooling regressions
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build

      - name: Services' host tests
        run: dotnet test tests/OutWit.OS.Tests --configuration Release --no-build

      - name: Cache pinned LLVM installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads/LLVM-20.1.8-win64.exe
          key: llvm-20.1.8-win64-3197846a2b190636

      - name: Cache pinned musl tarball, compiler-rt builtins and the LLVM C++ runtime sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/musl-1.2.5.tar.gz
            .tools/downloads/libunwind-20.1.8.src.tar.xz
            .tools/downloads/libcxxabi-20.1.8.src.tar.xz
            .tools/downloads/libcxx-20.1.8.src.tar.xz
            .tools/downloads/linux-headers-4.19.88-2.tar.xz
            .tools/llvm-runtimes-20.1.8/llvm-project
            .tools/compiler-rt
            .tools/libc-test
          key: substrate-pins-${{ hashFiles('src/Substrate/compiler-rt.lock.json', 'src/Substrate/libc-test.lock.json', 'src/Substrate/llvm-runtimes.lock.json', 'src/Substrate/linux-headers.lock.json') }}-musl-1.2.5

      - name: Check source formatting
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- format-check

      - name: Extract verified QEMU, clang, musl, libc-test and the LLVM C++ runtimes
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: Check environment
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- doctor

      - name: Run real VM integration scenarios
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test

      - name: Release kernel without self-tests
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release

      - name: The RISC-V kernel suite (V1.2)
        # The third ISA's kernel foundation: the self-test kernel's scenarios on the virt board under EDK II over OpenSBI,
        # the kernel image an ELF the tool converts to PE32+; user mode joins at V1.3 and the other harts at V1.4.
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test --arch riscv64

      - name: The RISC-V release kernel
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release --arch riscv64

      - name: Upload boot image and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-kernel-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/x64/boot/BOOTX64.EFI
            artifacts/x64/boot/UserFixture.pe
            artifacts/x64/boot/ThreadFixture.pe
            artifacts/x64/boot/WaitFixture.pe
            artifacts/x64/boot/PeFixture.pe
            artifacts/x64/boot/PeFixedFixture.pe
            artifacts/x64/boot/PeFixture.map
            artifacts/x64/boot/PeFixedFixture.map
            artifacts/x64/boot/BootstrapFixture.pe
            artifacts/x64/boot/TlsFixture.pe
            artifacts/x64/boot/compiler-tls-build.json
            artifacts/x64/boot/compiler-tls-disassembly.log
            artifacts/x64/boot/WitOS-x64.img
            artifacts/x64/boot/WitOS.pdb
            artifacts/x64/boot/WitOS.map
            artifacts/x64/boot/build.txt
            artifacts/riscv64/boot/BOOTRISCV64.EFI
            artifacts/riscv64/boot/WitOS.elf
            artifacts/riscv64/boot/WitOS.map
            artifacts/riscv64/boot/WitOS-riscv64.img
            artifacts/riscv64/boot/build.txt
            artifacts/riscv64/release/BOOTRISCV64.EFI
            artifacts/riscv64/release/WitOS.elf
            artifacts/riscv64/release/WitOS.map
            artifacts/riscv64/release/build.txt
            artifacts/logs/

  itanium-reference:
    # The oracle of the cxx scenario (S4): tests/User/cxx_main.cpp built natively on Linux with the host's clang and C++
    # library must print the Itanium trace that tests/User/cxx_itanium_trace.h records and that the guest must match.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the C++ scenarios natively
        run: clang++ --version && clang++ -std=c++20 -O2 -fdeclspec -w -pthread tests/User/cxx_exceptions.cpp tests/User/cxx_main.cpp -o cxx_main

      - name: Run them against the recorded Itanium trace
        run: ./cxx_main

  linux-host:
    # The Linux development host (plan steps T2.1a and T2.1b): the tool, its process runner and host tests, the pinned
    # LLVM and QEMU (built from its source release), the release kernels of both ISAs and the Unix-form runtime for
    # witos (phase R). The scenarios of `test`, the layer-2 ones among them, run in linux-selftest (T2.2). Upstream's
    # PAL suite and slices of its runtime tests (R7) run here too, which take about an hour of the job, and the device
    # services' and applications' scenarios (phases D and N) after them. Each ISA's runtime is a leg of its own (D5.2):
    # one after the other they outgrew three hours. The host tests and the source style run in the x64 leg. Each leg
    # uploads the .NET install and the services it built for the NuGet libraries' own suites (N2.2), which run in jobs of
    # their own.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install what building QEMU, running LLVM and driving dotnet/runtime's native build need
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          bison bzip2 cmake flex g++ gcc libglib2.0-dev libicu-dev libkrb5-dev liblttng-ust-dev libpixman-1-dev
          libssl-dev libxml2 make ninja-build pkg-config python3 python3-venv xz-utils zlib1g-dev

      - name: Cache the pinned LLVM and QEMU releases and the built QEMU
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/LLVM-20.1.8-Linux-X64.tar.xz
            .tools/downloads/qemu-11.1.0.tar.xz
            .tools/qemu-11.1.0
          key: linux-ubuntu-24.04-llvm-20.1.8-1ead36b3dfcb774b-qemu-11.1.0-6ee1d1a61f682124-riscv64

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Extract verified LLVM, build QEMU, fetch musl, compiler-rt, the LLVM runtimes and libc-test
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: Check environment
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- doctor

      - name: Host tests, whose native harnesses the pinned clang builds
        if: matrix.arch == 'x64'
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build

      - name: Services' host tests
        if: matrix.arch == 'x64'
        run: dotnet test tests/OutWit.OS.Tests --configuration Release --no-build

      - name: QEMU timeout cleanup through QMP
        if: matrix.arch == 'x64'
        run: dotnet test tests/WitOS.Dev.Tests --configuration Release --no-build --filter TestCategory=QemuCleanup

      - name: Release kernel without self-tests
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release --arch ${{ matrix.arch }}

      - name: The Unix-form runtime for witos-${{ matrix.arch }} (CoreLib, NativeAOT's native part, try_run, ILC)
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- runtime-witos --arch ${{ matrix.arch }}

      - name: Upload the .NET install and the services the NuGet libraries' suites boot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-runtime-install-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3
          path: |
            artifacts/runtime-witos/ilc/${{ matrix.arch }}/DeviceManager
            artifacts/runtime-witos/ilc/${{ matrix.arch }}/VirtioBlock
            artifacts/runtime-witos/ilc/${{ matrix.arch }}/Namespace
            artifacts/runtime-witos/ilc/${{ matrix.arch }}/VirtioConsole
            artifacts/runtime-witos/ilc/${{ matrix.arch }}/VirtioInput
            artifacts/runtime-witos/ilc/${{ matrix.arch }}/Terminal
            artifacts/runtime-witos/ilc/${{ matrix.arch }}/Display
            artifacts/runtime-witos/src/artifacts/bin/coreclr/witos.${{ matrix.arch }}.Release/libcoreclr.so
            artifacts/runtime-witos/src/artifacts/bin/coreclr/witos.${{ matrix.arch }}.Release/libclrjit.so
            artifacts/runtime-witos/src/artifacts/bin/coreclr/witos.${{ matrix.arch }}.Release/IL/System.Private.CoreLib.dll
            artifacts/runtime-witos/src/artifacts/bin/witos-${{ matrix.arch }}.Release/corehost/dotnet
            artifacts/runtime-witos/src/artifacts/bin/witos-${{ matrix.arch }}.Release/corehost/libhostfxr.so
            artifacts/runtime-witos/src/artifacts/bin/witos-${{ matrix.arch }}.Release/corehost/libhostpolicy.so
            artifacts/runtime-witos/src/artifacts/bin/microsoft.netcore.app.runtime.witos-${{ matrix.arch }}/Release/runtimes/witos-${{ matrix.arch }}/lib/*/*.dll
            artifacts/runtime-witos/src/artifacts/bin/microsoft.netcore.app.runtime.witos-${{ matrix.arch }}/Release/runtimes/witos-${{ matrix.arch }}/native/libSystem.*.so
            artifacts/runtime-witos/compatibility-${{ matrix.arch }}.json

      - name: Source style
        if: matrix.arch == 'x64'
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- format-check

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-linux-host-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/logs
            artifacts/${{ matrix.arch }}/release/build.txt
            artifacts/runtime-witos/patch-set.json
            artifacts/runtime-witos/tryrun-*.json

  nuget-suites:
    # The NuGet libraries' own test suites (plan step N2.2) run for hours in the guest, longer than a linux-host leg may
    # run beside the runtime's build. Each ISA's suites run in the groups build/runtime/nuget-suites.json names, a job a
    # group, on the .NET install and the services that ISA's linux-host leg built: a job builds its group's suites at
    # their repositories' commits, runs them on the host, then in the guest, which must pass what the host passed.
    needs: linux-host
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        group: [roslyn, roslyn-syntax, serialization-numerics, test-frameworks]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install what building QEMU and running LLVM need
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          bison bzip2 flex gcc libglib2.0-dev libpixman-1-dev make ninja-build pkg-config python3 python3-venv xz-utils
          zlib1g-dev

      - name: Cache the pinned LLVM and QEMU releases and the built QEMU
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/LLVM-20.1.8-Linux-X64.tar.xz
            .tools/downloads/qemu-11.1.0.tar.xz
            .tools/qemu-11.1.0
          key: linux-ubuntu-24.04-llvm-20.1.8-1ead36b3dfcb774b-qemu-11.1.0-6ee1d1a61f682124-riscv64

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Extract verified LLVM, build QEMU, fetch musl, compiler-rt, the LLVM runtimes and ICU
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: Download the .NET install and the services of witos-${{ matrix.arch }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: witos-runtime-install-${{ matrix.arch }}
          path: artifacts/runtime-witos

      - name: The NuGet libraries' suites of group ${{ matrix.group }} on the host, then in the guest
        run: >-
          dotnet run --project tools/WitOS.Dev --configuration Release --no-build --
          runtime-nuget-suites --arch ${{ matrix.arch }} --group ${{ matrix.group }}

      - name: Upload the suites' logs and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-nuget-suites-${{ matrix.arch }}-${{ matrix.group }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/logs
            artifacts/nuget-suites
            artifacts/runtime-witos/nuget-suites-*.json

  side-by-side:
    # .NET 8 LTS beside .NET 10 (plan step N3): dotnet/runtime's release/8.0 with its own pin and patch set is built for
    # witos on each ISA and installed beside the .NET 10 the linux-host leg built and uploaded; through 10.0's dotnet and
    # hostfxr, applications built for .NET 8 and .NET 10 run on the framework their runtimeconfig and rollForward pick
    # (N3.3), and every sysroot build checks ABI-2 1.0.
    needs: linux-host
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install what building QEMU, running LLVM and driving dotnet/runtime's native build need
        # The same packages as linux-host's: the 8.0 tree's crosscomponents configure (the DAC for the Linux host)
        # requires LTTng's header, as 10.0's does, and the witos patch of pal/src/configure.cmake exempts the target
        # build alone.
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          bison bzip2 cmake flex g++ gcc libglib2.0-dev libicu-dev libkrb5-dev liblttng-ust-dev libpixman-1-dev
          libssl-dev libxml2 make ninja-build pkg-config python3 python3-venv xz-utils zlib1g-dev

      - name: Cache the pinned LLVM and QEMU releases and the built QEMU
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/LLVM-20.1.8-Linux-X64.tar.xz
            .tools/downloads/qemu-11.1.0.tar.xz
            .tools/qemu-11.1.0
          key: linux-ubuntu-24.04-llvm-20.1.8-1ead36b3dfcb774b-qemu-11.1.0-6ee1d1a61f682124-riscv64

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Extract verified LLVM, build QEMU, fetch musl, compiler-rt, the LLVM runtimes and ICU
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: Download the .NET 10 install and the services of witos-${{ matrix.arch }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: witos-runtime-install-${{ matrix.arch }}
          path: artifacts/runtime-witos

      - name: .NET 8 for witos-${{ matrix.arch }} beside .NET 10
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- runtime-side-by-side --arch ${{ matrix.arch }}

      - name: Upload the side-by-side logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-side-by-side-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/logs
            artifacts/runtime-witos/tryrun-release-8.0-*.json

  windows-publish:
    # Goal 2 literally (plan step N4.4): the .NET compatibility suite and the portable application published on Windows
    # by the stock SDK without a RID, the same MSBuild as Visual Studio's, with a manifest of every file's bytes, for the
    # job that runs exactly those bytes on WitOS.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Build the tool
        run: dotnet build tools/WitOS.Dev --configuration Release

      - name: Publish the applications with the stock SDK and no RID
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- publish-apps --output artifacts/published-apps

      - name: Upload the published applications
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-published-apps-windows
          if-no-files-found: error
          retention-days: 3
          path: artifacts/published-apps

  published-on-windows:
    # Goal 2 literally (plan step N4.4): exactly the bytes windows-publish uploaded run on WitOS, through the .NET
    # install and the services the linux-host leg built, and every check of the suite must end as it ended there for
    # the suite that leg published on Linux.
    needs: [linux-host, windows-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install what building QEMU and running LLVM need
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          bison bzip2 flex gcc libglib2.0-dev libpixman-1-dev make ninja-build pkg-config python3 python3-venv xz-utils
          zlib1g-dev

      - name: Cache the pinned LLVM and QEMU releases and the built QEMU
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/LLVM-20.1.8-Linux-X64.tar.xz
            .tools/downloads/qemu-11.1.0.tar.xz
            .tools/qemu-11.1.0
          key: linux-ubuntu-24.04-llvm-20.1.8-1ead36b3dfcb774b-qemu-11.1.0-6ee1d1a61f682124-riscv64

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Extract verified LLVM, build QEMU, fetch musl, compiler-rt, the LLVM runtimes and ICU
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: Download the .NET install, the services and the suite's record of witos-${{ matrix.arch }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: witos-runtime-install-${{ matrix.arch }}
          path: artifacts/runtime-witos

      - name: Download the applications published on Windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: witos-published-apps-windows
          path: artifacts/published-apps

      - name: The applications published on Windows, on witos-${{ matrix.arch }}
        run: >-
          dotnet run --project tools/WitOS.Dev --configuration Release --no-build --
          runtime-published --arch ${{ matrix.arch }} --published artifacts/published-apps

      - name: Upload the logs and the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-published-on-windows-${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/logs
            artifacts/runtime-witos/compatibility-published-${{ matrix.arch }}.json

  boot-arm64:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Cache pinned QEMU download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads
          key: qemu-windows-x64-20260811-5bcf9eed634e8575

      - name: Cache pinned LLVM installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/downloads/LLVM-20.1.8-win64.exe
          key: llvm-20.1.8-win64-3197846a2b190636

      - name: Cache pinned musl tarball, compiler-rt builtins and the LLVM C++ runtime sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/musl-1.2.5.tar.gz
            .tools/downloads/libunwind-20.1.8.src.tar.xz
            .tools/downloads/libcxxabi-20.1.8.src.tar.xz
            .tools/downloads/libcxx-20.1.8.src.tar.xz
            .tools/downloads/linux-headers-4.19.88-2.tar.xz
            .tools/llvm-runtimes-20.1.8/llvm-project
            .tools/compiler-rt
            .tools/libc-test
          key: substrate-pins-${{ hashFiles('src/Substrate/compiler-rt.lock.json', 'src/Substrate/libc-test.lock.json', 'src/Substrate/llvm-runtimes.lock.json', 'src/Substrate/linux-headers.lock.json') }}-musl-1.2.5

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Extract verified QEMU, clang, musl, libc-test and the LLVM C++ runtimes
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: ARM64 boot-only scenarios on QEMU virt
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test --arch arm64

      - name: ARM64 release kernel without self-tests
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release --arch arm64

      - name: Upload ARM64 boot image and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-kernel-arm64
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/arm64/boot/BOOTAA64.EFI
            artifacts/arm64/boot/WitOS-arm64.img
            artifacts/arm64/boot/WitOS.pdb
            artifacts/arm64/boot/WitOS.map
            artifacts/arm64/boot/build.txt
            artifacts/logs/arm64-*

  linux-selftest:
    # The Linux host's parity with Windows (plan step T2.2): every scenario of `test` on both ISAs, the self-test kernels
    # with the mechanism fixtures (clang's since K8.3, no MSVC since K8.4a) and the layer-2 scenarios on the release
    # kernel, as the Windows jobs run them; and the RISC-V kernel suite (V1.2) on the QEMU built with riscv64-softmmu.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install what building QEMU and running LLVM need
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          bison bzip2 cmake flex g++ gcc libglib2.0-dev libpixman-1-dev make ninja-build pkg-config python3 python3-venv
          xz-utils zlib1g-dev

      - name: Cache the pinned LLVM and QEMU releases and the built QEMU
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/downloads/LLVM-20.1.8-Linux-X64.tar.xz
            .tools/downloads/qemu-11.1.0.tar.xz
            .tools/qemu-11.1.0
          key: linux-ubuntu-24.04-llvm-20.1.8-1ead36b3dfcb774b-qemu-11.1.0-6ee1d1a61f682124-riscv64

      - name: Build host tools
        run: dotnet build WitOS.slnx --configuration Release

      - name: Extract verified LLVM, build QEMU, fetch musl, compiler-rt, the LLVM runtimes and libc-test
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- setup

      - name: The x64 suite
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test

      - name: The ARM64 suite
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test --arch arm64

      - name: The RISC-V suite
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- test --arch riscv64

      - name: The RISC-V release kernel
        run: dotnet run --project tools/WitOS.Dev --configuration Release --no-build -- release --arch riscv64

      - name: Upload Linux self-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: witos-linux-selftest
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/logs
